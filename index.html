<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>館山 夜釣り遠征 釣果ボード</title>
  <meta name="description" content="館山夜釣り遠征(2026.10.16-17)の釣果をみんなで報告し合うボード">
  <meta name="theme-color" content="#0e1628">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1628'/%3E%3Cpath d='M32 8 22 22v16c0 4 4 7 10 7s10-3 10-7V22z' fill='%23f1ece0'/%3E%3Cg stroke='%23f1ece0' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M25 45l-4 12M30 46l-1 12M34 46l1 12M39 45l4 12'/%3E%3C/g%3E%3Ccircle cx='28' cy='36' r='2' fill='%230e1628'/%3E%3Ccircle cx='36' cy='36' r='2' fill='%230e1628'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="topnav">
    <a href="./" aria-current="page">釣果ボード</a>
    <a href="schedule.html">スケジュール</a>
    <button type="button" class="me-chip" id="me-chip"></button>
  </nav>

  <header class="hero">
    <h1 id="hero-title">館山<br>夜釣り遠征</h1>
    <p class="hero-date"><span id="hero-date">2026.10.16 FRI → 10.17 SAT</span></p>
    <section class="latest" id="latest" aria-label="最新の釣果"></section>
    <p class="mode-note" id="mode-note" hidden></p>
  </header>

  <main class="layout">
    <section class="block ranking wb" id="ranking" aria-labelledby="ranking-title">
      <div class="block-head">
        <h2 id="ranking-title"><span class="wb-title">釣果ランキング</span></h2>
        <span class="live" id="live-dot" hidden>LIVE</span>
      </div>
      <div class="seg" id="rank-tabs" role="tablist"></div>
      <ol class="rank-list" id="rank-list"></ol>
    </section>

    <section class="block spots" aria-labelledby="spots-title">
      <div class="block-head">
        <h2 id="spots-title">ポイント</h2>
        <span class="hint" id="spots-note">順繰りに回ってみる</span>
      </div>
      <div class="spot-tabs" id="spot-tabs" role="tablist"></div>
      <div class="map-wrap">
        <div id="map" aria-label="釣り場の地図"></div>
        <div class="map-tools">
          <button type="button" class="chip-btn" id="layer-toggle">航空写真</button>
          <button type="button" class="chip-btn" id="locate-btn">現在地</button>
        </div>
        <button type="button" class="chip-btn save-view" id="save-view">ここを初期位置にする</button>
        <div class="pick-banner" id="pick-banner" hidden>
          <span>釣れた場所をタップ</span>
          <button type="button" id="pick-cancel">やめる</button>
        </div>
      </div>
    </section>

    <section class="block feed-block" aria-labelledby="feed-title">
      <div class="block-head">
        <h2 id="feed-title">みんなの釣果</h2>
        <select id="feed-filter" class="select-sm" aria-label="表示するポイント">
          <option value="all">ぜんぶ</option>
        </select>
      </div>
      <ol class="feed" id="feed"></ol>
    </section>
  </main>

  <footer class="foot">
    <p>地図・航空写真：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 地理院タイル</a></p>
    <p class="goal">終わり：<span id="goal-text">午前中 終了予定</span></p>
  </footer>

  <button type="button" class="rank-bar" id="rank-bar" aria-label="ランキングを見る" hidden></button>
  <button type="button" class="fab" id="fab"><span aria-hidden="true">＋</span>釣った！</button>

  <!-- 釣果の登録 -->
  <dialog class="sheet" id="catch-dialog" aria-labelledby="dialog-title">
    <form id="catch-form" method="dialog" novalidate>
      <div class="sheet-head">
        <h3 id="dialog-title">釣果を登録</h3>
        <button type="button" class="icon-btn" data-close aria-label="閉じる">×</button>
      </div>

      <div class="who-row">
        <span class="who" id="who"></span>
        <button type="button" class="link-btn" id="who-change">変更</button>
      </div>

      <div class="field">
        <span class="label">ポイント</span>
        <div class="seg seg-wrap" id="form-spot"></div>
      </div>

      <fieldset class="field">
        <legend class="label">釣った魚</legend>
        <div class="fish-grid" id="fish-grid"></div>
      </fieldset>

      <label class="field">
        <span class="label">サイズ <small>cm(イカは胴長)・わかれば</small></span>
        <input type="number" name="size" id="f-size" inputmode="decimal" min="0.1" max="299" step="0.1" placeholder="25">
      </label>

      <label class="field">
        <span class="label">ひとこと</span>
        <input type="text" name="comment" id="f-comment" maxlength="200" placeholder="きたーーー！">
      </label>

      <div class="field">
        <span class="label">写真</span>
        <label class="photo-drop">
          <input type="file" accept="image/*" id="f-photo">
          <img id="photo-preview" alt="" hidden>
          <span id="photo-hint">タップして写真をえらぶ</span>
        </label>
      </div>

      <p class="form-error" id="form-error" role="alert"></p>
      <button type="submit" class="submit" id="submit-btn">登録する</button>
    </form>
  </dialog>

  <!-- 名前とアイコン -->
  <dialog class="sheet" id="profile-dialog" aria-labelledby="profile-title">
    <form id="profile-form" method="dialog" novalidate>
      <div class="sheet-head">
        <h3 id="profile-title">名前とアイコン</h3>
        <button type="button" class="icon-btn" data-close aria-label="閉じる">×</button>
      </div>
      <p class="sheet-lead" id="profile-lead">このブラウザに覚えておくので、次からは入力いりません。</p>

      <div class="profile-row">
        <label class="avatar-pick" aria-label="アイコン画像をえらぶ">
          <input type="file" accept="image/*" id="p-avatar">
          <img id="p-avatar-img" alt="" hidden>
          <span id="p-avatar-ph">＋<br>アイコン</span>
        </label>
        <label class="field grow">
          <span class="label">名前</span>
          <input type="text" id="p-name" maxlength="20" autocomplete="nickname" list="angler-list" placeholder="たけし">
          <datalist id="angler-list"></datalist>
        </label>
      </div>
      <p class="tiny-note" id="p-status"></p>

      <label class="field" id="p-pass-field" hidden>
        <span class="label">合言葉 <small>はじめての名前のときだけ</small></span>
        <input type="text" id="p-pass" autocomplete="off" placeholder="グループで決めた合言葉">
      </label>

      <p class="form-error" id="p-error" role="alert"></p>
      <button type="submit" class="submit" id="p-submit">これでOK</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
